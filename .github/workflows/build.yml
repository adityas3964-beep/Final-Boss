name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Directory Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Search for Gradle files ==="
          find . -name "settings.gradle*" -o -name "build.gradle*"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            TARGET_DIR=$(dirname "$SETTINGS_FILE")
            echo "Building inside: $TARGET_DIR"
            cd "$TARGET_DIR"
            gradle assembleDebug --no-daemon --stacktrace
          elif [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "Building in root directory"
            gradle assembleDebug --no-daemon --stacktrace
          else
            echo "CRITICAL: No Gradle project files found in repository!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-assistant-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 7
